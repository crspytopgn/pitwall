name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch Boxflat for protocol cross-checks
        run: |
          git clone --depth 1 https://github.com/Lawstorant/boxflat /tmp/boxflat
          pip install pyyaml
      - name: Backend tests
        env:
          BOXFLAT_DIR: /tmp/boxflat
        run: python -m unittest discover -s tests -v
      - name: Type-check and package
        run: |
          pnpm install --frozen-lockfile
          npx tsc --noEmit --skipLibCheck -p .
          ./scripts/package.sh
      - name: Standalone package
        run: |
          bash -n standalone/install.sh standalone/uninstall.sh
          ./scripts/package_standalone.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pitwall
          path: out/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Pitwall-standalone
          path: out/*.tar.gz
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/*.tar.gz
