name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the packages to this existing release tag (e.g. 0.1.0)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch Boxflat for protocol cross-checks
        run: |
          git clone --depth 1 https://github.com/Lawstorant/boxflat /tmp/boxflat
          pip install pyyaml
      - name: Backend tests
        env:
          BOXFLAT_DIR: /tmp/boxflat
        run: python -m unittest discover -s tests -v
      - name: Type-check and package
        run: |
          pnpm install --frozen-lockfile
          npx tsc --noEmit --skipLibCheck -p .
          ./scripts/package.sh
      - name: Standalone package
        run: |
          bash -n standalone/install.sh standalone/uninstall.sh
          ./scripts/package_standalone.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pitwall
          path: out/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Pitwall-standalone
          path: out/*.tar.gz
      - name: Release notes file
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        id: notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          f="docs/release-notes/${TAG#v}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; fi
      # Runs for a pushed tag, a release published on github.com, or a manual
      # run with a tag: builds both packages and attaches them, with the notes
      # file if there is one. Tags with or without a leading "v" both work.
      - name: Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            out/*.zip
            out/*.tar.gz
